[package]
name = "wayline-tools"
version = "0.1.0"
edition = "2021"
description = "Cross-platform repository build and test tools"
license = "GPL-3.0-only"

[dependencies]
wayline-flash = { path = "../wayline-flash" }
sha2 = "0.10"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Services",
] }
