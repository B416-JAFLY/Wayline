[package]
name = "wayline-tools"
version = "0.1.0"
edition = "2021"
description = "Cross-platform repository build and test tools"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
flate2 = "1"
process-wrap = { version = "10.0.1", default-features = false, features = ["std", "job-object", "process-group"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
tar = "0.4"
tempfile = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
wayline-flash = { path = "../wayline-flash" }
sha2 = "0.10"
serde_json = "1"
strip-ansi-escapes = "0.2"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Services",
] }
