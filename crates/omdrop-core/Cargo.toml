[package]
name = "omdrop-core"
version = "0.1.0"
edition = "2021"
description = "Rust AirDrop network core: AWDL interface values and mDNS discovery/advertising"
license = "GPL-3.0-only"

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
hex = "0.4"
omdrop-airdrop = { path = "../omdrop-airdrop" }
omdrop-net = { path = "../omdrop-net" }
omdrop-board = { path = "../omdrop-board" }
rcgen = "0.14"
rustls = "0.23"
sha2 = "0.10"
socket2 = "0.6"
tempfile = "3"
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Devices_Bluetooth_Advertisement",
    "Storage_Streams",
    "Win32_System_WinRT",
] }

[dev-dependencies]
