[package]
name = "wayline-host"
version = "0.1.0"
edition = "2024"
description = "Shared user configuration, identity and Windows AWDL selection"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
wayline-core = { path = "../wayline-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Com", "Win32_UI_Shell"] }
