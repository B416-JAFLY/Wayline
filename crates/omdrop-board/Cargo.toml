[package]
name = "omdrop-board"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Best-effort file-transfer feedback through the existing OWL process"

[dependencies]
omdrop-proto = { path = "../omdrop-proto" }
getrandom = "0.4"

[target.'cfg(windows)'.dependencies]
tokio = { version = "1", features = ["rt", "net", "io-util", "time"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }
