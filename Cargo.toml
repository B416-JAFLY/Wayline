[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "apps/cli",
    "apps/bridge",
    "crates/wayline-awdl",
    "crates/wayline-board",
    "crates/wayline-core",
    "crates/wayline-host",
    "crates/wayline-flash",
    "crates/wayline-proto",
    "crates/wayline-radio",
    "crates/wayline-service",
    "crates/wayline-transport",
]
# ESP32 uses the Xtensa toolchain and its own lockfile/release profile.
# Third-party compatibility patches are not workspace members.
exclude = ["firmware", "vendor/stacksafe-macro", "vendor/owly-awdl", "vendor/owly-airdrop"]

[patch.crates-io]
# Backport upstream macro diagnostics without upgrading GPUI's stacksafe 0.1 runtime.
# See vendor/stacksafe-macro/README.md for source revisions and removal criteria.
stacksafe-macro = { path = "vendor/stacksafe-macro" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# Favor speed in the measured archive/compression hot paths.
# See docs/DEVELOPMENT.md and crates/wayline-core/examples/archive_bench.rs.
[profile.release.package.owly-airdrop]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.zlib-rs]
opt-level = 3

[profile.release.package.adler2]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3
