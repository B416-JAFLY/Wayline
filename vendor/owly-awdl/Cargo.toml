[package]
name = "owly-awdl"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/t4t5/owly"
description = "Pinned Owly AWDL with USB receive timestamp support"
publish = false

[features]
driver = ["dep:tokio", "dep:tracing"]

[dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"], optional = true }
tracing = { version = "0.1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[[test]]
name = "driver"
required-features = ["driver"]

[lints.rust]
unsafe_code = "deny"
