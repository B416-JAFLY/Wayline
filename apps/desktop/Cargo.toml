[package]
name = "omdrop-desktop"
version = "0.1.0"
edition = "2024"
description = "Native GPUI AirDrop capsule and Windows radio service"
license = "GPL-3.0-only"

[target.'cfg(windows)'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
anyhow = "1"
omdrop-core = { path = "../../crates/omdrop-core" }
omdrop-service = { path = "../../crates/omdrop-service" }
omdrop-host = { path = "../../crates/omdrop-host" }
omdrop-flash = { path = "../../crates/omdrop-flash" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-segmentation = "1"
raw-window-handle = "0.6"
resvg = { version = "0.45.1", default-features = false }
windows-core = "0.62"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.62", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock",
    "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_System_Services",
    "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole",
    "Win32_System_Memory", "Win32_System_SystemServices", "Win32_System_Registry", "Win32_System_DataExchange",
    "Win32_UI_Shell_Common",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
tempfile = "3"
